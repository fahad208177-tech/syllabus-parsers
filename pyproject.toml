[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syllabus-parsers"
version = "0.1.0"
description = "Turn official exam syllabus PDFs (digital SAT, ACT, AP, Alberta Diploma) into structured, citable learning objectives."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24"]
keywords = ["syllabus", "education", "sat", "act", "ap", "pdf", "edtech", "curriculum"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/fahad208177-tech/syllabus-parsers"
"Used by" = "https://github.com/fahad208177-tech/Syllabuddy"

[project.scripts]
syllabus-parse = "syllabus_parsers.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["syllabus_parsers"]
